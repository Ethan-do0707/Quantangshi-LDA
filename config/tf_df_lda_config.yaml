{
  "schema_version": 1,
  "base_cleaning_config": "config/cleaning_config.yaml",
  "corpora": {
    "A": {"min_tf": 1, "min_df": 1},
    "B": {"min_tf": 2, "min_df": 2},
    "C": {"min_tf": 3, "min_df": 3},
    "D": {"min_tf": 5, "min_df": 3}
  },
  "paths": {
    "corpus_output_root": "output/tf_df_sensitivity",
    "model_output_root": "output/lda_sensitivity/models",
    "reports_root": "reports/lda_sensitivity",
    "log_path": "logs/lda_sensitivity.log"
  },
  "lda": {
    "implementation": "sklearn.decomposition.LatentDirichletAllocation",
    "learning_method": "batch",
    "topic_counts": [20, 30, 40, 50, 60],
    "random_seeds": [42, 2026, 20260830],
    "max_iter": 30,
    "n_jobs": -1,
    "evaluate_every": -1,
    "perp_tol": 0.1,
    "mean_change_tol": 0.001,
    "max_doc_update_iter": 100,
    "doc_topic_prior": null,
    "topic_word_prior": null,
    "verbose": 1
  },
  "metrics": {
    "top_words": 20,
    "representative_poems_per_topic": 5,
    "coherence": "document_npmi",
    "stability": "hungarian_matched_top_word_jaccard"
  },
  "execution": {
    "resume": true
  }
}
